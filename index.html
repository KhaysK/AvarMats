// Порядок форм у прилагательных: [оно, он, она, они]
const COP = ['буго', 'вуго', 'йиго', 'руго'];
const G = ['ср', 'м', 'ж', 'мн'];

  ugly:   { ar: ['сурукъаб','сурукъав','сурукъай','сурукъал'], ru: ['уродливое','уродливый','уродливая','уродливые'] },
  good:   { ar: ['лъикІаб','лъикІав','лъикІай','лъикІал'], ru: ['хорошее','хороший','хорошая','хорошие'] },
  bad:    { ar: ['квешаб','квешав','квешай','квешал'], ru: ['плохое','плохой','плохая','плохие'] },
  old:    { ar: ['хераб','херав','херай','херал'], ru: ['старое','старый','старая','старые'] },
  young:  { ar: ['гІолохъанаб','гІолохъанав','гІолохъанай','гІолохъанал'], ru: ['молодое','молодой','молодая','молодые'] },
  mature: { ar: ['балугъаб','балугъав','балугъай','балугъал'], ru: ['зрелое','зрелый','зрелая','зрелые'] },
  adult:  { ar: ['гІураб','гІурав','гІурай','гІурал'], ru: ['взрослое','взрослый','взрослая','взрослые'] },
  rich:   { ar: ['бечедаб','бечедав','бечедай','бечедал'], ru: ['богатое','богатый','богатая','богатые'] },

  clever: { ar: ['цІодораб','цІодорав','цІодорай','цІодорал'], ru: ['умное','умный','умная','умные'] },
  stupid: { ar: ['жагьилаб','жагьилав','жагьилай','жагьилал'], ru: ['глупое','глупый','глупая','глупые'] },

// формы прилагательного как отдельные слова
function adjWords(...names) {
  const out = [];
  for (const n of names) for (let g = 0; g < 4; g++)
    out.push(`${ADJ[n].ar[g]} | ${ADJ[n].ru[g]} (${G[g]})`);
  return out.join('\n');
}
// «это/он/она ... + прилагательное + есть» по всем формам
function sentences(dem, ruDem, adjNames, adjKey) {
  const out = [];
  for (const n of adjNames) {
    const a = ADJ[n];
    for (let g = 0; g < 4; g++)
      out.push(`${dem[g]} ${a.ar[g]} ${COP[g]} | ${ruDem[g]} ${a.ru[g]}`);
  }
  return out.join('\n');
}
// я/ты/мы/вы + прилагательное
function pronAdj(names) {
  const out = [];
  for (const n of names) {
    const a = ADJ[n];
    out.push(`дун ${a.ar[1]} вуго | я ${a.ru[1]}`);
    out.push(`дун ${a.ar[2]} йиго | я ${a.ru[2]}`);
    out.push(`мун ${a.ar[1]} вуго | ты ${a.ru[1]}`);
    out.push(`мун ${a.ar[2]} йиго | ты ${a.ru[2]}`);
    out.push(`ниж ${a.ar[3]} руго | мы ${a.ru[3]}`);
    out.push(`нуж ${a.ar[3]} руго | вы ${a.ru[3]}`);
  }
  return out.join('\n');
}

// ===== ПАРСИНГ =====
const LESSONS = RAW.map(L => {
  const seen = new Set();
  const items = [];
  const push = (it) => { if (!seen.has(it.ar)) { seen.add(it.ar); items.push(it); } };
  const lines = (s) => s.split('\n').map(x => x.trim()).filter(Boolean);
  for (const l of lines(L.words)) { const [ar, ru] = l.split('|').map(x => x.trim()); push({ t: 'w', ar, ru, n: L.n }); }
  for (const l of lines(L.phrases)) { const [ar, ru] = l.split('|').map(x => x.trim()); push({ t: 'p', ar, ru, n: L.n }); }
  const fixes = lines(L.fixes).map(l => { const [wrong, right, ru] = l.split('|').map(x => x.trim()); return { t: 'f', ar: right, wrong, ru, n: L.n }; });
  // учатся только слова; фразы и «ошибки» — практика, привязанная к словам урока
  const ordered = items.filter(i => i.t === 'w').concat(items.filter(i => i.t === 'p'), fixes);
  ordered.forEach(it => { it.key = it.n + ':' + it.ar; });
  const wmap = new Map();
  ordered.filter(i => i.t === 'w' && !/\s/.test(i.ar)).forEach(w => { const k = norm(w.ar); if (!wmap.has(k)) wmap.set(k, w.key); });
  ordered.filter(i => i.t !== 'w').forEach(it => { it.req = [...new Set(it.ar.split(/\s+/).map(x => wmap.get(norm(x))).filter(Boolean))]; });
  return { n: L.n, title: L.title, sub: L.sub, items: ordered };
});
const ALL = LESSONS.flatMap(L => L.items);
const BY_KEY = Object.fromEntries(ALL.map(i => [i.key, i]));
const TRANSL = ALL.filter(i => i.t !== 'f'); // пул для вариантов ответа

// ===== НОРМАЛИЗАЦИЯ И СХОДСТВО =====
function norm(s) {
  return s.toLowerCase().replace(/(?<=[а-яёa-z])!(?=[а-яёa-z])/g, 'ӏ').replace(/́/g, '').replace(/[іiӏ1ǀ]/g, 'ӏ').replace(/ё/g, 'е')
    .replace(/[.,!?;:«»"“”—–\-]/g, ' ').replace(/\s+/g, ' ').trim();
}
const tri = (s) => { s = norm(s); const o = new Set(); for (let i = 0; i < s.length - 2; i++) o.add(s.slice(i, i + 3)); return o; };
function sim(a, b) { const A = tri(a), B = tri(b); let c = 0; A.forEach(x => { if (B.has(x)) c++; }); const u = A.size + B.size - c; return u ? c / u : 0; }
const tokens = (s) => s.split(/\s+/).filter(Boolean);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a) => a[Math.floor(Math.random() * a.length)];

// допустимые ответы: любой перевод с тем же русским текстом
const ARS_FOR_RU = {};
ALL.forEach(i => { (ARS_FOR_RU[norm(i.ru)] = ARS_FOR_RU[norm(i.ru)] || new Set()).add(norm(i.ar)); });
const RUS_FOR_AR = {};
ALL.forEach(i => { (RUS_FOR_AR[norm(i.ar)] = RUS_FOR_AR[norm(i.ar)] || new Set()).add(norm(i.ru)); });
const acceptable = (it) => it.t === 'f' ? new Set([norm(it.ar)]) : (ARS_FOR_RU[norm(it.ru)] || new Set([norm(it.ar)]));

// ===== ХРАНИЛИЩЕ =====
const LS = 'avar_cards_v1';
let ST = { it: {} };
try { const raw = localStorage.getItem(LS); if (raw) ST = JSON.parse(raw); } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(ST)); } catch (e) {} };
const rec = (k) => ST.it[k] || { b: 0, s: 0, w: 0, r: 0, t: 0 };
const isWeak = (k) => { const r = rec(k); return r.s && (r.b <= 1) && r.w > 0; };

// ===== ВЫБОР ВАРИАНТОВ =====
function distractors(it, field, count) {
  const same = field === 'ru' ? ARS_FOR_RU[norm(it.ru)] : null;
  const ownRu = new Set([norm(it.ru)]);
  let pool = TRANSL.filter(x => x.key !== it.key && (field === 'ru' ? !ownRu.has(norm(x.ru)) : !(same && same.has(norm(x.ar)))));
  const sameT = pool.filter(x => (it.t === 'w') === (x.t === 'w')); if (sameT.length >= 8) pool = sameT;
  const sameLesson = pool.filter(x => x.n === it.n);
  if (sameLesson.length >= 10) pool = sameLesson;
  const tc = tokens(it[field]).length;
  const scored = pool.map(x => ({ x, s: sim(x[field], it[field]) + (tokens(x[field]).length === tc ? 0.2 : 0) + Math.random() * 0.15 }))
    .sort((a, b) => b.s - a.s);
  const out = []; const used = new Set([norm(it[field])]);
  for (const { x } of scored) { const v = norm(x[field]); if (used.has(v)) continue; used.add(v); out.push(x[field]); if (out.length >= count) break; }
  return out;
}
function bankTokens(it, extra) {
  const target = tokens(it.ar); const tset = new Set(target.map(norm));
  const pool = TRANSL.filter(x => x.key !== it.key && x.n === it.n);
  const cand = new Map();
  pool.forEach(x => tokens(x.ar).forEach(w => { if (!tset.has(norm(w))) cand.set(norm(w), w); }));
  const scored = [...cand.values()].map(w => ({ w, s: Math.max(...target.map(t => sim(w, t))) + Math.random() * 0.2 })).sort((a, b) => b.s - a.s);
  return target.concat(scored.slice(0, extra).map(o => o.w));
}

const SPECIAL = ['І', 'гъ', 'гь', 'гІ', 'къ', 'кк', 'кв', 'кІ', 'хъ', 'хь', 'хІ', 'цІ', 'чІ', 'тІ', 'лъ', 'лІ'];

function home() {
  S = null; location.hash = '';
  const seenAll = ALL.filter(i => i.t === 'w' && rec(i.key).s).length;
  const weakAll = ALL.filter(i => i.t === 'w' && isWeak(i.key)).length;
  let h = `<header><h1>Авар мацІ</h1><p class="sub">Карточки по урокам · прогресс хранится в этом браузере</p></header>`;
  h += `<div class="row2">
    <button class="btn" data-act="practice-all" ${seenAll ? '' : 'disabled'}>Все уроки<small>повторение</small></button>
    <button class="btn" data-act="practice-weak" ${weakAll ? '' : 'disabled'}>Слабые места<small>${weakAll} шт.</small></button></div>`;
  for (const L of LESSONS) {
    const W = L.items.filter(i => i.t === 'w');
    const tot = W.length;
    const seen = W.filter(i => rec(i.key).s).length;
    const learned = W.filter(i => rec(i.key).b >= 3).length;
    const weak = W.filter(i => isWeak(i.key)).length;
    const nw = tot, nf = L.items.length - tot;
    h += `<section class="card lesson">
      <div class="lh"><div><h2>${L.title}</h2><div class="sub">${esc(L.sub)}</div></div><div class="cnt">${tot} слов</div></div>
      <div class="meta">${nw} слов для заучивания · ${nf} фраз для практики</div>
      <div class="bar"><i style="width:${Math.round(learned / tot * 100)}%"></i><i class="b2" style="width:${Math.round((seen - learned) / tot * 100)}%"></i></div>
      <div class="meta">выучено ${learned} · начато ${seen}${weak ? ` · <b class="warn">слабых ${weak}</b>` : ''}</div>
      <div class="row2"><button class="btn primary" data-act="practice" data-n="${L.n}">Практика</button>
      <button class="btn" data-act="study" data-n="${L.n}">Карточки</button></div></section>`;
  }
  h += `<footer><button class="link" id="reset">Сбросить весь прогресс</button></footer>`;
  $app.innerHTML = h;
  $app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act, n = +b.dataset.n;
    if (a === 'practice') startPractice({ lessons: [n] });
    if (a === 'practice-all') startPractice({ all: true });
    if (a === 'practice-weak') startPractice({ all: true, weak: true });
    if (a === 'study') startStudy(n);
  });
  const r = document.getElementById('reset');
  r.onclick = () => {
    if (r.dataset.sure) { ST = { it: {} }; save(); home(); }
    else { r.dataset.sure = 1; r.textContent = 'Точно сбросить? Нажми ещё раз'; r.classList.add('warn'); setTimeout(() => { if (r.isConnected) { delete r.dataset.sure; r.textContent = 'Сбросить весь прогресс'; r.classList.remove('warn'); } }, 4000); }
  };
}

  const { L } = S;
  const f = S.filter;
  const deck = S.deck.filter(i => f === 'all' || (f === 'w' && i.t === 'w') || (f === 'p' && i.t === 'p') || (f === 'f' && i.t === 'f'));
  if (S.i >= deck.length) S.i = 0;
  const it = deck[S.i];
  const chip = (k, t) => `<button class="chip ${f === k ? 'on' : ''}" data-f="${k}">${t}</button>`;
  let front, back;
  if (it.t === 'f') { front = `<div class="lbl">Найди ошибку</div><div class="big bad">${esc(it.wrong)}</div>`; back = `<div class="big good">${esc(it.ar)}</div><div class="ru">${esc(it.ru)}</div>`; }
  else if (S.rev) { front = `<div class="big">${esc(it.ru)}</div>`; back = `<div class="big">${esc(it.ar)}</div>`; }
  else { front = `<div class="big">${esc(it.ar)}</div>`; back = `<div class="big">${esc(it.ru)}</div>`; }
  $app.innerHTML = `<div class="top"><button class="x" id="home">←</button><div class="ttl">${L.title} · карточки</div><div class="pos">${S.i + 1}/${deck.length}</div></div>
   <div class="chips">${chip('all', 'Все')}${chip('w', 'Слова')}${chip('p', 'Фразы')}${chip('f', 'Ошибки')}
   <button class="chip ${S.rev ? 'on' : ''}" id="rev">RU→AV</button><button class="chip" id="shuf">Перемешать</button></div>
   <div class="flip ${S.flip ? 'back' : ''}" id="flip"><div class="face">${S.flip ? back : front}</div><div class="hint">нажми, чтобы перевернуть</div></div>
   <div class="row2"><button class="btn" id="prev">← Назад</button><button class="btn primary" id="next">Дальше →</button></div>`;
  document.getElementById('home').onclick = home;
  document.getElementById('flip').onclick = () => { S.flip = !S.flip; renderStudy(); };
  document.getElementById('next').onclick = () => { S.i = (S.i + 1) % deck.length; S.flip = false; renderStudy(); };
  document.getElementById('prev').onclick = () => { S.i = (S.i - 1 + deck.length) % deck.length; S.flip = false; renderStudy(); };
  document.getElementById('rev').onclick = () => { S.rev = !S.rev; S.flip = false; renderStudy(); };
  document.getElementById('shuf').onclick = () => { S.deck = shuffle(S.deck); S.i = 0; S.flip = false; renderStudy(); };
  $app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; S.i = 0; S.flip = false; renderStudy(); });
}

// ----- практика -----
const NEW_PER_SESSION = 6, SESSION_LEN = 16;
function weightOf(k) {
  const r = rec(k); const base = [6, 4, 2.5, 1.2, 0.5][r.b];
  const days = r.t ? Math.min(14, (Date.now() - r.t) / 864e5) : 0;
  return base * (1 + Math.min(r.w, 5) * 0.3) * (1 + days / 7);
}
function eligible(it, extra) { return (it.req || []).every(k => rec(k).s || (extra && extra.has(k))); }
function sampleWeighted(arr, n, wf) {
  const rest = arr.slice(), out = [];
  while (out.length < n && rest.length) {
    const ws = rest.map(wf); let x = Math.random() * ws.reduce((a, b) => a + b, 0), idx = 0;
    for (; idx < rest.length; idx++) { x -= ws[idx]; if (x <= 0) break; }
    out.push(rest.splice(Math.min(idx, rest.length - 1), 1)[0]);
  }
  return out;
}
function sentWeight(it) {
  const reqs = it.req || []; const r = rec(it.key);
  const wk = reqs.length ? reqs.reduce((a, k) => a + weightOf(k), 0) / reqs.length : 2;
  const days = r.t ? (Date.now() - r.t) / 864e5 : 14;
  return wk * (days < 1 ? 0.2 : 1 + Math.min(days, 14) / 7) * (1 + Math.min(r.w, 5) * 0.3);
}
function startPractice(opt) {
  const pool = opt.all ? ALL.slice() : ALL.filter(i => opt.lessons.includes(i.n));
  const words = pool.filter(i => i.t === 'w');
  const fresh = opt.all ? [] : words.filter(i => !rec(i.key).s).slice(0, NEW_PER_SESSION);
  const seenW = words.filter(i => rec(i.key).s);
  const revW = opt.weak ? seenW.filter(i => isWeak(i.key) || rec(i.key).b <= 1) : seenW;
  const freshKeys = new Set(fresh.map(i => i.key));
  let sents = pool.filter(i => i.t !== 'w' && eligible(i, freshKeys));
  if (opt.weak) sents = sents.filter(i => (i.req || []).some(k => isWeak(k) || rec(k).b <= 1));
  const R = Math.max(0, SESSION_LEN - fresh.length);
  let sT = Math.min(sents.length, Math.round(R * 0.45));
  let wT = Math.min(revW.length, R - sT);
  if (wT < R - sT) sT = Math.min(sents.length, R - wT);
  const pickedW = sampleWeighted(revW, wT, i => weightOf(i.key));
  const pickedS = sampleWeighted(sents, sT, sentWeight);
  const queue = [];
  fresh.forEach(i => queue.push({ it: i, intro: true }));
  shuffle(fresh.concat(pickedW, pickedS)).forEach(i => queue.push({ it: i, retry: 0, missed: false }));
  if (!queue.length) { home(); return; }
  S = { mode: 'practice', opt, queue, total: queue.filter(q => !q.intro).length, done: 0, ok: 0, miss: [], lastFmt: {} };
  nextQ();
}
function pickFmt(it, q) {
  const multi = tokens(it.ar).length >= 2;
  let opts;
  if (it.t === 'w') {
    const b = rec(it.key).b;
    opts = b === 0 ? ['ar2ru'] : b === 1 ? ['ru2ar'] : b === 2 ? (multi ? ['build'] : ['type']) : b === 3 ? ['type'] : (multi ? ['type', 'build', 'ar2ru'] : ['type', 'ar2ru']);
  } else {
    const lvl = (it.req && it.req.length) ? Math.min(...it.req.map(k => rec(k).b)) : 2;
    if (it.t === 'f') opts = lvl <= 1 ? ['fixchoice'] : lvl === 2 ? ['fixbuild'] : ['fixtype', 'fixbuild'];
    else opts = lvl <= 1 ? ['ar2ru'] : lvl === 2 ? (multi ? ['build', 'ru2ar'] : ['type']) : (multi ? ['type', 'build', 'ru2ar'] : ['type']);
  }
  if (q.retry) {
    opts = it.t === 'f' ? ['fixchoice', 'fixbuild', 'fixtype'] : multi ? ['ar2ru', 'ru2ar', 'build', 'type'] : ['ar2ru', 'ru2ar', 'type'];
    opts = opts.filter(o => o !== S.lastFmt[it.key]);
  }
  return rnd(opts);
}
function nextQ() {
  if (!S.queue.length) return finish();
  const q = S.queue.shift(); S.cur = q;
  if (q.intro) return renderIntro(q);
  const fmt = pickFmt(q.it, q); S.lastFmt[q.it.key] = fmt; S.fmt = fmt;
  renderQ(q, fmt);
}
const topbar = () => {
  const pct = Math.round(S.done / S.total * 100);
  return `<div class="top"><button class="x" id="home">✕</button><div class="prog"><i style="width:${pct}%"></i></div><div class="pos">${S.done}/${S.total}</div></div>`;
};
const bindHome = () => { const h = document.getElementById('home'); if (h) h.onclick = home; };

function renderIntro(q) {
  const it = q.it;
  const body = it.t === 'f'
    ? `<div class="lbl">Частая ошибка</div><div class="big bad">${esc(it.wrong)}</div><div class="arrow">↓ правильно</div><div class="big good">${esc(it.ar)}</div><div class="ru">${esc(it.ru)}</div>`
    : `<div class="lbl">Новое</div><div class="big">${esc(it.ar)}</div><div class="ru">${esc(it.ru)}</div>`;
  $app.innerHTML = `${topbar()}<div class="qwrap"><div class="card intro">${body}</div></div>
   <div class="dock"><button class="btn primary wide" id="go">Запомнил</button></div>`;
  bindHome(); document.getElementById('go').onclick = nextQ;
}

function renderQ(q, fmt) {
  const it = q.it; let body = '', dock = '';
  if (fmt === 'ar2ru' || fmt === 'ru2ar') {
    const f = fmt === 'ar2ru' ? 'ru' : 'ar', p = fmt === 'ar2ru' ? 'ar' : 'ru';
    const opts = shuffle([it[f]].concat(distractors(it, f, 3)));
    S.opts = opts;
    body = `<div class="lbl">${fmt === 'ar2ru' ? 'Переведи на русский' : 'Переведи на аварский'}</div><div class="big">${esc(it[p])}</div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else if (fmt === 'fixchoice') {
    const opts = shuffle([it.ar, it.wrong]);
    body = `<div class="lbl">Какой вариант верный?</div><div class="ru big2">${esc(it.ru)}</div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    S.opts = opts;
  } else if (fmt === 'build' || fmt === 'fixbuild') {
    const toks = fmt === 'build' ? bankTokens(it, tokens(it.ar).length >= 4 ? 3 : 2)
      : (() => { const rt = tokens(it.ar); const rs = new Set(rt.map(norm)); const ex = tokens(it.wrong).filter(w => !rs.has(norm(w))); return rt.concat([...new Set(ex)]); })();
    S.bank = shuffle(toks.map((w, i) => ({ w, id: i }))); S.ans = [];
    body = `<div class="lbl">${fmt === 'build' ? 'Собери предложение' : 'Исправь ошибку — собери верно'}</div>
      ${fmt === 'fixbuild' ? `<div class="big bad small">${esc(it.wrong)}</div>` : ''}<div class="ru big2">${esc(it.ru)}</div>
      <div class="slot" id="ans"></div><div class="bank" id="bank"></div>`;
    dock = `<button class="btn primary wide" id="check" disabled>Проверить</button>`;
  } else { // type / fixtype
    body = `<div class="lbl">${fmt === 'type' ? 'Напиши на аварском' : 'Исправь ошибку — напиши верно'}</div>
      ${fmt === 'fixtype' ? `<div class="big bad small">${esc(it.wrong)}</div>` : ''}<div class="ru big2">${esc(it.ru)}</div>
      <input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ответ…">
      <div class="keys">${SPECIAL.map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}</div>
      <div class="pal">І — палочка (кІ, гІ, цІ…). Вместо неё можно писать «!», «I», «1» или «і» — засчитается.</div>`;
    dock = `<div class="row2 dk"><button class="btn" id="idk">Не знаю</button><button class="btn primary" id="check">Проверить</button></div>`;
  }
  $app.innerHTML = `${topbar()}<div class="qwrap"><div class="card q">${body}</div></div><div class="dock" id="dock">${dock}</div>`;
  bindHome();
  if (fmt === 'ar2ru' || fmt === 'ru2ar' || fmt === 'fixchoice') {
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const val = S.opts[+b.dataset.i];
      const ok = fmt === 'fixchoice' ? norm(val) === norm(it.ar)
        : fmt === 'ar2ru' ? (RUS_FOR_AR[norm(it.ar)] || new Set([norm(it.ru)])).has(norm(val)) : acceptable(it).has(norm(val));
      $app.querySelectorAll('.opt').forEach(x => { x.disabled = true; const v = S.opts[+x.dataset.i];
        const good = fmt === 'fixchoice' ? norm(v) === norm(it.ar) : fmt === 'ar2ru' ? (RUS_FOR_AR[norm(it.ar)] || new Set([norm(it.ru)])).has(norm(v)) : acceptable(it).has(norm(v));
        if (good) x.classList.add('good'); else if (x === b) x.classList.add('bad'); });
      answer(ok, null);
    });
  } else if (fmt === 'build' || fmt === 'fixbuild') {
    const drawB = () => {
      document.getElementById('ans').innerHTML = S.ans.map(t => `<button class="tok" data-id="${t.id}" data-from="a">${esc(t.w)}</button>`).join('');
      const used = new Set(S.ans.map(t => t.id));
      document.getElementById('bank').innerHTML = S.bank.map(t => used.has(t.id) ? `<span class="tok ghost">${esc(t.w)}</span>` : `<button class="tok" data-id="${t.id}" data-from="b">${esc(t.w)}</button>`).join('');
      document.getElementById('check').disabled = !S.ans.length;
      $app.querySelectorAll('.tok[data-id]').forEach(b => b.onclick = () => {
        const id = +b.dataset.id;
        if (b.dataset.from === 'b') S.ans.push(S.bank.find(t => t.id === id)); else S.ans = S.ans.filter(t => t.id !== id);
        drawB();
      });
    };
    drawB();
    document.getElementById('check').onclick = () => {
      const given = S.ans.map(t => t.w).join(' ');
      const ok = acceptable(it).has(norm(given));
      answer(ok, given);
    };
  } else {
    const inp = document.getElementById('inp'); setTimeout(() => { try { inp.focus(); } catch (e) {} }, 50);
    $app.querySelectorAll('.key').forEach(k => k.onmousedown = (e) => { e.preventDefault(); });
    $app.querySelectorAll('.key').forEach(k => k.onclick = () => {
      const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + k.dataset.k + inp.value.slice(e);
      const pos = s + k.dataset.k.length; inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (x) {}
    });
    const check = () => { const v = inp.value; if (!v.trim()) return; answer(acceptable(it).has(norm(v)), v); };
    document.getElementById('check').onclick = check;
    document.getElementById('idk').onclick = () => answer(false, '');
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
  }
}

function answer(ok, given) {
  const q = S.cur, it = q.it;
  S.fbAt = Date.now();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // убрать клавиатуру
  const r = Object.assign({}, rec(it.key)); r.s = 1; r.t = Date.now();
  if (it.t === 'w') {
    if (ok) { r.r++; r.b = q.missed ? Math.max(r.b, 1) : Math.min(4, r.b + 1); }
    else { r.w++; r.b = 0; }
  } else if (ok) r.r++;
  else { // ошибка во фразе: слова из неё считаем менее выученными
    r.w++;
    if (!q.missed) (it.req || []).forEach(k => { const x = Object.assign({}, rec(k)); x.b = Math.max(0, x.b - 1); ST.it[k] = x; });
  }
  ST.it[it.key] = r; save();
  let again = false;
  if (ok) { S.done++; if (!q.missed) S.ok++; }
  else {
    if (!S.miss.includes(it)) S.miss.push(it);
    if (q.retry < 2) { again = true; const pos = Math.min(S.queue.length, 3 + Math.floor(Math.random() * 2)); S.queue.splice(pos, 0, { it, retry: q.retry + 1, missed: true }); }
    else S.done++;
  }
  const ans = it.t === 'f' ? it.ar : it.ar;
  const dock = document.getElementById('dock');
  const shown = (S.fmt === 'ar2ru') ? it.ru : ans;
  dock.innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><div class="fbt">${ok ? 'Верно!' : 'Не совсем'}</div>
    ${ok && (S.fmt === 'ar2ru') ? '' : `<div class="fba">${ok ? '' : 'Правильно: '}<b>${esc(shown)}</b></div>`}
    ${!ok && given ? `<div class="fbg">Ты написал: ${esc(given)}</div>` : ''}
    ${(S.fmt === 'ar2ru' && !ok) ? `<div class="fbg">${esc(it.ar)}</div>` : ''}
    ${again ? '<div class="fbg">Это ещё встретится — позже и по-другому.</div>' : ''}
    <button class="btn primary wide" id="nx">Дальше</button></div>`;
  const nx = document.getElementById('nx'); nx.onclick = () => { if (Date.now() - S.fbAt > 300) nextQ(); };
  const top = document.querySelector('.prog i'); if (top) top.style.width = Math.round(S.done / S.total * 100) + '%';
}

function finish() {
  const acc = S.total ? Math.round(S.ok / S.total * 100) : 100;
  $app.innerHTML = `<div class="top"><button class="x" id="home">←</button><div class="ttl">Готово</div><div></div></div>
   <section class="card done"><div class="score">${acc}%</div><div class="sub">с первого раза · ${S.ok} из ${S.total}</div>
   ${S.miss.length ? `<h3>Повтори:</h3><ul class="miss">${S.miss.map(i => `<li><b>${esc(i.ar)}</b><span>${esc(i.ru)}</span></li>`).join('')}</ul>` : '<p>Без ошибок — отлично!</p>'}
   </section><div class="row2"><button class="btn primary" id="again">Ещё раунд</button><button class="btn" id="home2">К урокам</button></div>`;
  const opt = S.opt; bindHome();
  document.getElementById('home2').onclick = home;
  document.getElementById('again').onclick = () => startPractice(opt);
}

// Enter = кнопка «Проверить» / «Дальше» / «Запомнил»; тап мимо поля убирает клавиатуру
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.repeat || !S || S.mode !== 'practice') return;
  const nx = document.getElementById('nx'), go = document.getElementById('go'), ck = document.getElementById('check'), inp = document.getElementById('inp');
  if (nx) { if (Date.now() - S.fbAt > 300) { e.preventDefault(); nx.click(); } else e.preventDefault(); }
  else if (go) { e.preventDefault(); go.click(); }
  else if (ck && !inp && !ck.disabled) { e.preventDefault(); ck.click(); }
});
document.addEventListener('pointerdown', (e) => {
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT' && !e.target.closest('#inp,.key,.dock')) a.blur();
});
// на iPhone кнопка внизу поднимается над клавиатурой
function fitKb() {
  const v = window.visualViewport; if (!v) return;
  const kb = Math.max(0, window.innerHeight - v.height - v.offsetTop);
  document.documentElement.style.setProperty('--kb', kb + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitKb); visualViewport.addEventListener('scroll', fitKb); }

home();
